<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena</title>
    <style>
        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        button {
            background-color: red;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>

    <div style="text-align: center;">
        <h1 style="color: white; text-align: center;">Welcome to the Arena</h1>
        <br>
        <label for="username" style="color: white; text-align: center;">Username:</label>
        <br>
        <input type="text" id="username" name="username">
        <br><br>
        <label for="password" style="color: white; text-align: center;">Password:</label>
        <br>
        <input type="password" id="password" name="password">
        <br><br><br>
        <button onclick="openGame()">Open Game</button>
    </div>

    <script type="text/javascript">

        function createWindow(src, width, height){
            const params = new URLSearchParams();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            params.set('username', username);
            params.set('password', password);

            const url = `${src}?${params.toString()}`;
            var win = window.open(url, "_new", "width="+width+", height="+height);

            win.addEventListener("resize", function(){
                console.log("Resized");
                win.resizeTo(width, height);
            });
        }

        function openGame() {
            const width = 1280;
            const height = 960;
            createWindow("/jogar", width, height);
        }
    </script>
</body>
</html>
